<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Militar - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-card">
    <h2>Acesso ao Portal</h2>
    <form id="loginForm">
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit">Entrar</button>
    </form>
    <p class="link-text">Ainda não tem conta? <a href="register.html">Cadastre-se</a></p>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msgDiv = document.getElementById('message');

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          msgDiv.innerText = 'Login realizado com sucesso! Redirecionando...';
          msgDiv.style.color = '#4CAF50';
          
          // Se for staff, podemos redirecionar para a área restrita
          setTimeout(() => {
            alert(`Bem-vindo, ${data.user.username}!`);
          }, 1000);
        } else {
          msgDiv.innerText = data.error || 'Erro ao fazer login.';
          msgDiv.style.color = '#f44336';
        }
      } catch (err) {
        msgDiv.innerText = 'Erro ao conectar ao servidor.';
        msgDiv.style.color = '#f44336';
      }
    });
  </script>
</body>
</html>
