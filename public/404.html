<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found-container {
      text-align: center;
      margin-top: 100px;
    }
    .logo-404 {
      font-size: 8rem;
      font-weight: bold;
      color: #d9534f;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="not-found-container">
    <div class="logo-404" id="secretLogo">404</div>
    <h1>Página Não Encontrada</h1>
    <p>A página que você está procurando não existe ou foi movida.</p>
    <a href="index.html" style="color: #4a90e2;">Voltar ao início</a>
  </div>

  <script>
    let clickCount = 0;
    const logo = document.getElementById('secretLogo');

    logo.addEventListener('click', () => {
      clickCount++;
      if (clickCount >= 3) {
        window.location.href = 'admin.html';
      }
    });
  </script>
</body>
</html>
